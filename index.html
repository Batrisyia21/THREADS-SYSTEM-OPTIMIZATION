    /* =========================================================================
       EVENT DELEGATION & INTERACTIVE HANDLERS
       ========================================================================= */
    document.addEventListener("click", (e) => {
      const target = e.target.closest("button, [data-select-case]");
      if (!target) return;

      // Sidebar & Bottom Nav Screen Jumps
      if (target.dataset.navScreen) {
        const nextId = Number(target.dataset.navScreen);
        // Close mobile sidebar after selecting
        document.getElementById("demo-sidebar").classList.remove("mobile-open");
        document.getElementById("mobile-menu-toggle").setAttribute("aria-expanded", "false");
        goToScreen(nextId);
        return;
      }

      // Demo Prev / Next / Reset
      if (target.id === "btn-prev-screen") {
        goToScreen(state.currentScreen - 1);
        return;
      }
      if (target.id === "btn-next-screen") {
        goToScreen(state.currentScreen + 1);
        return;
      }
      if (target.id === "btn-reset-demo") {
        if (feedLoadingTimer) clearTimeout(feedLoadingTimer);
        if (toastTimer) clearTimeout(toastTimer);
        state = createInitialState();
        render();
        showToast("Demo reset to initial state");
        return;
      }
      if (target.id === "mobile-menu-toggle") {
        const sb = document.getElementById("demo-sidebar");
        const open = sb.classList.toggle("mobile-open");
        target.setAttribute("aria-expanded", String(open));
        return;
      }

      // Toast Undo
      if (target.id === "btn-toast-undo" && state.toast && typeof state.toast.undoAction === "function") {
        const fn = state.toast.undoAction;
        clearToast();
        fn();
        return;
      }

      // --- SCREEN 1: SIGN-IN ---
      if (target.id === "btn-signin-ig") {
        state.signInAttempts += 1;
        if (state.simulateSignInFail || state.signInAttempts === 1) {
          state.signInError = true;
          render();
        } else {
          state.signInError = false;
          goToScreen(3);
          showToast("Signed in with Instagram");
        }
        return;
      }
      if (target.id === "btn-why-ig") {
        state.whyInstagramOpen = !state.whyInstagramOpen;
        render();
        return;
      }
      if (target.id === "btn-close-why") {
        state.whyInstagramOpen = false;
        render();
        return;
      }

      // --- SCREEN 2: CREATE POST ---
      if (target.id === "btn-cancel-post") {
        goToScreen(3);
        return;
      }
      if (target.dataset.selectPostCat) {
        state.draftCategory = target.dataset.selectPostCat;
        render();
        return;
      }
      if (target.id === "btn-submit-post") {
        if (state.draftText.trim().length === 0 || !state.draftCategory) return;
        const cat = state.draftCategory;
        state.posts.unshift({
          id: "p_" + Date.now(),
          author: "you",
          category: cat,
          time: "Just now",
          text: state.draftText.trim(),
          likes: 0,
          reposts: 0,
          liked: false,
          reposted: false,
          replies: []
        });
        state.draftText = "";
        state.draftCategory = null;
        state.feedTab = cat;
        goToScreen(3);
        showToast(`Post published to ${cat}`);
        return;
      }

      // --- SCREEN 3: FEED ---
      if (target.dataset.feedTab) {
        const tab = target.dataset.feedTab;
        state.feedTab = tab;
        state.openPostMenuId = null;
        state.feedLoading = true;
        if (feedLoadingTimer) clearTimeout(feedLoadingTimer);
        render();
        feedLoadingTimer = setTimeout(() => {
          state.feedLoading = false;
          feedLoadingTimer = null;
          render();
        }, 1500);
        return;
      }
      if (target.dataset.likePost) {
        const p = state.posts.find(x => x.id === target.dataset.likePost);
        if (p) {
          p.liked = !p.liked;
          p.likes += p.liked ? 1 : -1;
          render();
        }
        return;
      }
      if (target.dataset.repostPost) {
        const p = state.posts.find(x => x.id === target.dataset.repostPost);
        if (p) {
          p.reposted = !p.reposted;
          p.reposts += p.reposted ? 1 : -1;
          render();
        }
        return;
      }
      if (target.dataset.toggleReply) {
        const pid = target.dataset.toggleReply;
        state.openReplyPostId = state.openReplyPostId === pid ? null : pid;
        render();
        return;
      }
      if (target.dataset.sendReply) {
        const pid = target.dataset.sendReply;
        const txt = (state.replyDrafts[pid] || "").trim();
        if (!txt) return;
        const p = state.posts.find(x => x.id === pid);
        if (p) {
          p.replies.push({ author: "you", text: txt });
          state.replyDrafts[pid] = "";
          render();
          showToast("Reply posted");
        }
        return;
      }
      if (target.dataset.togglePostMenu) {
        const pid = target.dataset.togglePostMenu;
        state.openPostMenuId = state.openPostMenuId === pid ? null : pid;
        render();
        return;
      }
      if (target.dataset.openTune) {
        state.tuneTargetPostId = target.dataset.openTune;
        state.tuneQuestionText = "";
        state.openPostMenuId = null;
        goToScreen(4);
        return;
      }
      if (target.dataset.openReport) {
        const p = state.posts.find(x => x.id === target.dataset.openReport);
        if (p) {
          state.reportTargetPost = deepClone(p);
          state.reportGreenMsg = "";
          state.reportAmberMsg = "";
        }
        state.openPostMenuId = null;
        goToScreen(8);
        return;
      }
      if (target.id === "btn-unblock-all") {
        state.blockedAuthors = [];
        render();
        showToast("Blocked accounts restored");
        return;
      }

      // --- SCREEN 4: TUNE YOUR FEED ---
      if (target.id === "btn-close-tune") {
        state.tuneQuestionText = "";
        goToScreen(3);
        return;
      }
      if (target.id === "btn-tune-block") {
        const p = state.posts.find(x => x.id === state.tuneTargetPostId) || state.posts[0];
        const author = p ? p.author : "alex_12";
        if (!state.blockedAuthors.includes(author)) {
          state.blockedAuthors.push(author);
        }
        goToScreen(3);
        showToast(`Blocked @${author}. Posts hidden.`, {
          duration: 5000,
          undoAction: () => {
            state.blockedAuthors = state.blockedAuthors.filter(a => a !== author);
            render();
          }
        });
        return;
      }
      if (target.id === "btn-tune-quiet") {
        const p = state.posts.find(x => x.id === state.tuneTargetPostId) || state.posts[0];
        const pid = p ? p.id : "p1";
        if (!state.quietedPostIds.includes(pid)) {
          state.quietedPostIds.push(pid);
        }
        goToScreen(3);
        showToast("Done. Fewer posts like this.", {
          duration: 5000,
          undoAction: () => {
            state.quietedPostIds = state.quietedPostIds.filter(id => id !== pid);
            render();
          }
        });
        return;
      }
      if (target.id === "btn-tune-question") {
        const p = state.posts.find(x => x.id === state.tuneTargetPostId) || state.posts[0];
        const cat = p ? p.category : "Tech";
        const msg = `Recommended because you engage with ${cat} posts.`;
        state.tuneQuestionText = msg;
        render();
        showToast(msg, {
          duration: 5000,
          undoAction: () => {
            state.tuneQuestionText = "";
            render();
          }
        });
        return;
      }

      // --- SCREEN 5: HISTORY SEARCH ---
      if (target.dataset.searchAction) {
        const act = target.dataset.searchAction;
        if (state.searchDraft.actions.includes(act)) {
          state.searchDraft.actions = state.searchDraft.actions.filter(a => a !== act);
        } else {
          state.searchDraft.actions.push(act);
        }
        render();
        return;
      }
      if (target.id === "btn-run-search") {
        const d = state.searchDraft;
        if (d.from && d.to && d.from > d.to) return;
        state.searchApplied = deepClone(state.searchDraft);
        render();
        return;
      }
      if (target.id === "btn-reset-filters") {
        const blank = { keyword: "", actions: [], from: "", to: "", category: "All categories" };
        state.searchDraft = deepClone(blank);
        state.searchApplied = deepClone(blank);
        render();
        return;
      }

      // --- SCREEN 6: NOTIFICATIONS ---
      if (target.dataset.notifTab) {
        state.notifTab = target.dataset.notifTab;
        render();
        return;
      }
      if (target.id === "btn-mark-all-read") {
        state.notifications.forEach(n => {
          if (n.tab === state.notifTab) n.unread = false;
        });
        render();
        showToast(`Marked ${state.notifTab} notifications as read`);
        return;
      }
      if (target.dataset.readNotif) {
        const item = state.notifications.find(n => n.id === target.dataset.readNotif);
        if (item && item.unread) {
          item.unread = false;
          render();
        }
        return;
      }

      // --- SCREEN 7: PRIVACY DASHBOARD ---
      if (target.id === "toggle-partner-sharing") {
        state.privacy.sharePartners = !state.privacy.sharePartners;
        render();
        showToast("Saved");
        return;
      }
      if (target.id === "toggle-personalised-recs") {
        state.privacy.personalisedRecs = !state.privacy.personalisedRecs;
        render();
        showToast("Saved");
        return;
      }
      if (target.dataset.visibilityOpt) {
        const opt = target.dataset.visibilityOpt;
        if (opt === "Public" && state.privacy.visibility !== "Public") {
          state.publicConfirmOpen = true;
          render();
        } else if (opt !== state.privacy.visibility) {
          state.privacy.visibility = opt;
          render();
          showToast("Saved");
        }
        return;
      }
      if (target.id === "btn-cancel-public") {
        state.publicConfirmOpen = false;
        render();
        return;
      }
      if (target.id === "btn-confirm-public") {
        state.privacy.visibility = "Public";
        state.publicConfirmOpen = false;
        render();
        showToast("Saved");
        return;
      }

      // --- SCREEN 8: REPORT A POST ---
      if (target.id === "btn-open-report-dialog") {
        const pid = state.reportTargetPost.id;
        if (state.reportedPostIds.includes(pid)) {
          state.reportAmberMsg = "You have already reported this post.";
          state.reportDialogOpen = false;
          render();
        } else {
          state.reportDialogOpen = true;
          render();
        }
        return;
      }
      if (target.id === "btn-cancel-report") {
        state.reportDialogOpen = false;
        render();
        return;
      }
      if (target.id === "btn-confirm-report") {
        const pid = state.reportTargetPost.id;
        if (state.reportedPostIds.includes(pid)) {
          state.reportDialogOpen = false;
          state.reportAmberMsg = "You have already reported this post.";
          render();
          return;
        }
        state.reportedPostIds.push(pid);
        state.reportDialogOpen = false;
        state.reportAmberMsg = "";
        state.reportGreenMsg = "Report received. Case C-1042. We will review it and let you know.";
        render();
        showToast("Report received. Case C-1042.");
        return;
      }

      // --- SCREEN 9: MODERATION ---
      if (target.dataset.modTab) {
        state.modTab = target.dataset.modTab;
        const firstInTab = state.cases.find(c => c.status === state.modTab);
        state.selectedCaseId = firstInTab ? firstInTab.id : null;
        state.modDraftDecision = "";
        state.modSuspendConfirmed = false;
        render();
        return;
      }
      if (target.dataset.selectCase) {
        state.selectedCaseId = target.dataset.selectCase;
        state.modDraftDecision = "";
        state.modSuspendConfirmed = false;
        render();
        return;
      }
      if (target.id === "btn-send-factcheck") {
        const c = state.cases.find(x => x.id === state.selectedCaseId);
        if (c && c.status !== "Closed") {
          c.factCheckStatus = "Pending";
          c.factCheckNote = "Sent to Fact-Checking Partner";
          render();
          showToast("Sent to Fact-Checking Partner");
        }
        return;
      }
      if (target.id === "btn-submit-decision") {
        const c = state.cases.find(x => x.id === state.selectedCaseId);
        if (!c || c.status === "Closed" || !state.modDraftDecision) return;
        if (state.modDraftDecision === "Suspend" && !state.modSuspendConfirmed) return;

        c.status = "Closed";
        c.decision = state.modDraftDecision;
        state.previousActions.unshift({
          caseId: c.id,
          account: c.author,
          decision: c.decision,
          time: "Just now"
        });
        state.modDraftDecision = "";
        state.modSuspendConfirmed = false;
        render();
        showToast(`Case ${c.id} moved to Closed (${c.decision})`);
        return;
      }

      // --- SCREEN 10: ADMIN PANEL ---
      if (target.id === "btn-add-category") {
        const raw = state.newCategoryName.trim();
        if (!raw) {
          state.categoryError = "Category name is required.";
          render();
          return;
        }
        if (raw.length > 50) {
          state.categoryError = "Category name must be 50 characters or fewer.";
          render();
          return;
        }
        const duplicate = state.categories.some(c => c.name.toLowerCase() === raw.toLowerCase());
        if (duplicate) {
          state.categoryError = "That category already exists.";
          render();
          return;
        }
        state.categories.push({ name: raw, countLabel: "0 posts", isSystem: false });
        state.newCategoryName = "";
        state.categoryError = "";
        render();
        showToast(`Category "${raw}" added`);
        return;
      }
      if (target.dataset.saveRole) {
        const username = target.dataset.saveRole;
        const u = state.users.find(x => x.username === username);
        if (!u) return;
        if (u.pendingRole === u.role) {
          showToast(`No role changes for ${u.username}`);
          return;
        }
        const removesAccess = roleRank(u.pendingRole) < roleRank(u.role);
        if (removesAccess) {
          let area = "administrative controls";
          if (u.role === "Moderator" && u.pendingRole === "End-User") {
            area = "the moderation queue";
          } else if (u.role === "Administrator" && u.pendingRole === "Moderator") {
            area = "the administrator panel";
          } else if (u.role === "Administrator" && u.pendingRole === "End-User") {
            area = "the administrator panel and moderation queue";
          }
          state.roleConfirmModal = {
            username: u.username,
            oldRole: u.role,
            newRole: u.pendingRole,
            message: `Change ${u.username} from ${u.role} to ${u.pendingRole}? This removes access to ${area}.`
          };
          render();
        } else {
          applyRoleChange(u.username, u.pendingRole);
        }
        return;
      }
      if (target.id === "btn-cancel-role-change") {
        if (state.roleConfirmModal) {
          const u = state.users.find(x => x.username === state.roleConfirmModal.username);
          if (u) u.pendingRole = u.role;
        }
        state.roleConfirmModal = null;
        render();
        return;
      }
      if (target.id === "btn-confirm-role-change" && state.roleConfirmModal) {
        const { username, newRole } = state.roleConfirmModal;
        state.roleConfirmModal = null;
        applyRoleChange(username, newRole);
        return;
      }
      if (target.id === "btn-export-audit") {
        showToast("Access audit report exported");
        return;
      }
    });

    function applyRoleChange(username, newRole) {
      const u = state.users.find(x => x.username === username);
      if (!u) return;
      const oldRole = u.role;
      u.role = newRole;
      u.pendingRole = newRole;
      state.auditLog.unshift({
        id: "L-" + state.nextLogNumber,
        user: username,
        action: `Role change (${oldRole} to ${newRole})`
      });
      state.nextLogNumber += 1;
      render();
      showToast(`Updated ${username} to ${newRole}`);
    }

    // Input & Change Events (Preserve focus while typing!)
    document.addEventListener("input", (e) => {
      const t = e.target;

      // Screen 2: Live textarea counter & category error without destroying focus
      if (t.id === "create-post-textarea") {
        state.draftText = t.value.slice(0, 1000);
        const counter = document.getElementById("post-char-counter");
        if (counter) counter.textContent = `${state.draftText.length} / 1000`;
        const errEl = document.getElementById("create-cat-error");
        const missingCat = state.draftText.length > 0 && !state.draftCategory;
        if (errEl) errEl.style.display = missingCat ? "flex" : "none";
        const postBtn = document.getElementById("btn-submit-post");
        if (postBtn) postBtn.disabled = !(state.draftText.trim().length > 0 && state.draftCategory);
        return;
      }

      // Screen 3: Reply input draft
      if (t.dataset && t.dataset.replyInput) {
        state.replyDrafts[t.dataset.replyInput] = t.value;
        return;
      }

      // Screen 5: Keyword & Date live validation without losing focus
      if (t.id === "search-keyword") {
        state.searchDraft.keyword = t.value;
        return;
      }
      if (t.id === "search-from" || t.id === "search-to") {
        if (t.id === "search-from") state.searchDraft.from = t.value;
        if (t.id === "search-to") state.searchDraft.to = t.value;
        const invalid = Boolean(state.searchDraft.from && state.searchDraft.to && state.searchDraft.from > state.searchDraft.to);
        const errEl = document.getElementById("search-date-error");
        if (errEl) errEl.style.display = invalid ? "flex" : "none";
        const btn = document.getElementById("btn-run-search");
        if (btn) btn.disabled = invalid;
        return;
      }

      // Screen 10: New category input
      if (t.id === "input-new-category") {
        state.newCategoryName = t.value;
        if (state.categoryError) {
          state.categoryError = "";
          const errEl = document.getElementById("admin-cat-error");
          if (errEl) errEl.style.display = "none";
        }
        return;
      }
    });

    document.addEventListener("change", (e) => {
      const t = e.target;

      if (t.id === "chk-simulate-fail") {
        state.simulateSignInFail = t.checked;
        return;
      }
      if (t.id === "chk-annotations") {
        state.annotationsOn = t.checked;
        document.body.classList.toggle("annotations-on", state.annotationsOn);
        return;
      }
      if (t.id === "search-category") {
        state.searchDraft.category = t.value;
        return;
      }
      if (t.id === "mod-decision-select") {
        state.modDraftDecision = t.value;
        state.modSuspendConfirmed = false;
        render();
        return;
      }
      if (t.id === "chk-confirm-suspend") {
        state.modSuspendConfirmed = t.checked;
        const submitBtn = document.getElementById("btn-submit-decision");
        if (submitBtn) {
          submitBtn.disabled = !(state.modDraftDecision && state.modSuspendConfirmed);
        }
        return;
      }
      if (t.dataset && t.dataset.roleSelect) {
        const u = state.users.find(x => x.username === t.dataset.roleSelect);
        if (u) u.pendingRole = t.value;
        return;
      }
    });

    // Keyboard Shortcuts: Left/Right arrows for screens, Enter on table rows or search
    document.addEventListener("keydown", (e) => {
      const tag = document.activeElement ? document.activeElement.tagName : "";
      const isFormField = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";

      if (!isFormField && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
        e.preventDefault();
        if (e.key === "ArrowLeft" && state.currentScreen > 1) goToScreen(state.currentScreen - 1);
        if (e.key === "ArrowRight" && state.currentScreen < 10) goToScreen(state.currentScreen + 1);
        return;
      }

      if (e.key === "Enter" && document.activeElement && document.activeElement.dataset && document.activeElement.dataset.selectCase) {
        e.preventDefault();
        state.selectedCaseId = document.activeElement.dataset.selectCase;
        state.modDraftDecision = "";
        state.modSuspendConfirmed = false;
        render();
      }

      if (e.key === "Enter" && document.activeElement && document.activeElement.id === "search-keyword") {
        const d = state.searchDraft;
        if (!(d.from && d.to && d.from > d.to)) {
          state.searchApplied = deepClone(d);
          render();
        }
      }
    });

    // Initial render
    render();
  </script>
</body>
</html>
